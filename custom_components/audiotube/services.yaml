play_media:
  name: Play AudioTube media
  description: Play an AudioTube stream on a Home Assistant media player.
  fields:
    entity_id:
      name: Entity
      description: Target media player entity.
      required: true
      selector:
        entity:
          domain: media_player
    media_url:
      name: Media URL
      description: LAN-reachable MP3 URL served by the AudioTube proxy.
      required: true
      selector:
        text:
    title:
      name: Title
      description: Track title.
      required: true
      selector:
        text:
    artist:
      name: Artist
      description: Track artist shown by Sonos.
      required: false
      selector:
        text:
