<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AudioTube – YouTube-Audio auf Sonos und Browser (lokale Testversion)" />
  <title>AudioTube</title>
  <link rel="stylesheet" href="css/styles.css?v=20260922-6" />

  <!-- Prevent video embeds entirely (Content-Security-Policy) -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self' https:;
          script-src  'self';
          style-src   'self' 'unsafe-inline';
          img-src     'self' https: data:;
          media-src   'self';
          connect-src 'self';
          frame-src   'none';
          object-src  'none';
        " />
</head>
<body>
  <div id="app">
    <!-- Rendered by js/main.js -->
    <div class="loading-indicator" role="status" aria-live="polite">
      AudioTube wird geladen…
    </div>
  </div>

  <!--
    Served by the AudioTube Home Assistant integration itself, at /audiotube/.
    Search, audio resolution, and caching all run inside Home Assistant.

    No YouTube API key · No login · No video playback (CSP enforced)
  -->
  <script type="module" src="js/main.js?v=20260922-5"></script>
</body>
</html>
