# Minimal Home Assistant config for testing Tube Audio Player.
default_config:

# Allow the app (served from /local) to run inside an iframe panel.
http:
  use_x_frame_options: false

# The "Tube Audio" sidebar panel is registered by the custom integration
# `tube_audio_player` (custom_components/), which loads the app from:
#   /local/tube_audio_player/apps/local/index.html
tube_audio_player:
