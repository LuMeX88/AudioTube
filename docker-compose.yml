# Tube Audio Player — local test stack
# =====================================
# Two services:
#   1. homeassistant  → HA test instance on http://localhost:8123
#                        Serves the app UI as an iframe panel ("Tube Audio").
#   2. proxy          → Node + yt-dlp server on http://localhost:3001
#                        Resolves audio-only streams and proxies search.
#
# Start:  docker compose up -d --build
# Stop:   docker compose down
# Logs:   docker compose logs -f

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: tube-audio-ha
    ports:
      - "8123:8123"
    volumes:
      # Persistent HA config (configuration.yaml lives here).
      - ./deploy/homeassistant/config:/config
      # Shared app assets served by HA under /local/tube_audio_player/...
      - ./src:/config/www/tube_audio_player/src:ro
      - ./apps:/config/www/tube_audio_player/apps:ro
      # The HA custom component (optional integration scaffold).
      - ./apps/ha/custom_components/tube_audio_player:/config/custom_components/tube_audio_player:ro
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    container_name: tube-audio-proxy
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
